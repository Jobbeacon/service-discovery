spring:
  application:
    name: jobbeacon-discovery
  profiles:
    active: ${PROFILE_ACTIVE:local}

server:
  port: ${PORT:8761}

eureka:
  instance:
    hostname: ${EUREKA_HOSTNAME:localhost}
  client:
    # A single registry: it neither registers with itself nor copies another registry.
    register-with-eureka: false
    fetch-registry: false
  server:
    # Self-preservation keeps dead instances listed when many renewals are missed at once. With a handful of services
    # restarting during development that keeps stale entries around, so it is off by default and can be turned on.
    enable-self-preservation: ${EUREKA_SELF_PRESERVATION:false}
    eviction-interval-timer-in-ms: ${EUREKA_EVICTION_INTERVAL_MS:30000}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.netflix.eureka: WARN
    com.netflix.discovery: WARN
